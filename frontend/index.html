<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skillora</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#f4f7fb;
--ink:#172033;
--muted:#667085;
--brand:#4f46e5;
--brand2:#7c3aed;
--card:#fff;
--line:#e6eaf0
}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:var(--bg);
color:var(--ink)
}

header{
background:linear-gradient(135deg,#111827,#312e81);
color:#fff;
padding:18px 20px;
position:sticky;
top:0;
z-index:5;
box-shadow:0 8px 25px #0002
}

.header-inner{
max-width:1050px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px
}

.brand{
display:flex;
align-items:center;
gap:10px
}

.logo{
width:42px;
height:42px;
border-radius:13px;
background:#fff;
color:var(--brand);
display:grid;
place-items:center;
font-weight:900;
font-size:20px
}

header h1{
margin:0;
font-size:21px
}

#userArea{
font-size:13px;
opacity:.9
}

.container{
max-width:1050px;
margin:22px auto;
padding:0 16px
}

nav{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:18px
}

button{
border:0;
border-radius:12px;
padding:11px 15px;
cursor:pointer;
background:var(--brand);
color:#fff;
font:inherit;
font-weight:700;
transition:.15s
}

button:active{
transform:scale(.98)
}

button.secondary{
background:#e9edf5;
color:#253047
}

.hero{
background:linear-gradient(135deg,#fff,#eef0ff);
border:1px solid #e2e5ff;
border-radius:24px;
padding:28px;
margin-bottom:16px;
box-shadow:0 10px 35px #312e8112
}

.hero h2{
font-size:30px;
margin:0 0 10px
}

.hero p{
line-height:2;
color:#475467;
margin:0 0 18px
}

.hero-badge{
display:inline-block;
background:#e0e7ff;
color:#3730a3;
padding:6px 10px;
border-radius:999px;
font-size:12px;
font-weight:700;
margin-bottom:12px
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:20px;
margin-bottom:16px;
box-shadow:0 7px 24px #1018280b
}

.card h2{
margin-top:0
}

.feature{
min-height:130px
}

.feature-icon{
font-size:25px;
margin-bottom:8px
}

.muted{
color:var(--muted);
font-size:13px;
line-height:1.9
}

input,
textarea,
select{
width:100%;
padding:12px;
border:1px solid #d8dee9;
border-radius:12px;
margin:6px 0 12px;
font:inherit;
background:#fff
}

textarea{
min-height:110px;
resize:vertical
}

.project{
border:1px solid var(--line);
border-radius:16px;
padding:16px;
margin-top:11px;
background:#fbfcff
}

.project h3{
margin:0 0 8px
}

.project p{
line-height:1.9
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:999px;
background:#eef2ff;
color:#3730a3;
font-size:12px
}

.hidden{
display:none
}

.error{
color:#b42318;
margin:8px 0
}

.ok{
color:#027a48;
margin:8px 0
}

.footer-note{
margin-top:20px;
text-align:center
}

@media(max-width:600px){

header h1{
font-size:17px
}

.logo{
width:38px;
height:38px
}

#userArea{
font-size:11px
}

.hero{
padding:21px
}

.hero h2{
font-size:25px
}

nav button{
flex:1;
min-width:105px
}

}
</style>
</head>

<header>
<div class="header-inner">

<div class="brand">
<div class
